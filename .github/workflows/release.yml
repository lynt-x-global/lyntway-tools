name: Release

# Publishing is driven by a tag, so what ships is always a commit that
# exists in history rather than whatever happened to be on a laptop.
#
# Building here rather than uploading from a developer's machine is not
# only about convenience: the archive somebody downloads to check a receipt
# should be traceable to a commit and a workflow run, not to whoever
# happened to run the build.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Nothing publishes until the tests pass on the exact commit being
      # tagged. A release is the worst possible place to find out that the
      # thing which checks signatures no longer checks them.
      - name: Verify the tagged commit
        run: go vet ./... && go test ./... -race -count=1

      # The README claims this module has no third-party dependencies, and
      # somebody auditing the verifier is relying on that claim being true.
      - name: No third-party dependencies
        run: |
          if [ -s go.sum ]; then
            echo "::error::go.sum is not empty — this module has acquired a dependency"
            cat go.sum
            exit 1
          fi

      # The three tools ship together. `lyntway init` writes a config that
      # names lyntway-mcp, so a machine with one and not the others is a
      # machine where setup half-works and the gap shows up later as
      # missing evidence.
      - name: Build for every platform
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            rm -rf staging && mkdir -p staging
            for tool in lyntway lyntway-verify lyntway-mcp; do
              bin="staging/${tool}"
              [ "$os" = "windows" ] && bin="${bin}.exe"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath -ldflags="-s -w -X main.version=${version}" \
                -o "$bin" "./cmd/${tool}"
            done
            cp LICENSE README.md staging/
            tar -czf "dist/lyntway_${version}_${os}_${arch}.tar.gz" -C staging .
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Created rather than assumed to exist. Pushing a tag does not create
      # a release, so uploading to one would fail on the first release —
      # the exact moment nobody is watching the logs.
      - name: Publish
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          # Draft releases are invisible to Homebrew and to anyone following
          # a download link, so a release that stayed a draft is a release
          # that did not happen.
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
